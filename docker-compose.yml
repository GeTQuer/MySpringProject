services:
  database:
    image: postgres:15
    container_name: task-tracker-db
    environment:
      # Берем из локального .env и передаем в Postgres
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      # Используем $$ и внутренние переменные самого Postgres
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: myspringproject-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: task-tracker-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.1
    container_name: task-tracker-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  app:
    build: .
    container_name: task-tracker-app
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Пробрасываем переменные внутрь Spring Boot приложения
      DB_HOST: database  # Внутри сети Docker хостом БД является имя её сервиса
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DB_PORT: 5432      # Внутри контейнера порт всегда 5432, а не внешний ${DB_PORT}
      REDIS_HOST: redis  # Внутри сети Docker хостом Redis является имя её сервиса
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
    ports:
      - "8080:8080"
    restart: unless-stopped

# Инициализируем именованный том для вечного хранения данных
volumes:
  postgres_data: {}
  prometheus_data: {}
  grafana_data: {}
