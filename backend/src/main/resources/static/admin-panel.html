<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель администратора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/notifications.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; }
        .alert-container { min-height: 50px; }

        /* --- Карточка профиля --- */
        .profile-dropdown {
            min-width: 280px;
            padding: 0;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            text-align: center;
            color: #fff;
        }
        .profile-header .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 24px;
            font-weight: 600;
        }
        .profile-header .profile-username {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .profile-body {
            padding: 16px 20px;
            background: #fff;
        }
        .profile-body .profile-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 14px;
            color: #555;
        }
        .profile-body .profile-row .label { font-weight: 500; color: #888; }
        .profile-body .profile-row .value { font-weight: 600; color: #333; }
        .profile-footer {
            padding: 12px 20px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
        }
        .role-badge-USER { background-color: #0d6efd; }
        .role-badge-MANAGER { background-color: #fd7e14; }
        .role-badge-ADMIN { background-color: #dc3545; }
        .seniority-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
        .seniority-INTERN { background: #e3f2fd; color: #1565c0; }
        .seniority-JUNIOR { background: #e8f5e9; color: #2e7d32; }
        .seniority-MIDDLE { background: #fff3e0; color: #e65100; }
        .seniority-SENIOR { background: #fce4ec; color: #c62828; }
        .seniority-TEAM_LEAD { background: #f3e5f5; color: #6a1b9a; }
        .profile-toggle {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: 8px;
            transition: background 0.2s;
            color: #fff;
            text-decoration: none;
        }
        .profile-toggle:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .profile-toggle .avatar-sm {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Панель управления</a>
        <div class="collapse navbar-collapse">
            <div class="navbar-nav">
                <a class="nav-link active" href="/admin">Пользователи и Роли</a>
                <a class="nav-link" href="/tasks">Все Задачи</a>
            </div>
        </div>
        <!-- Карточка профиля (dropdown) -->
        <div class="dropdown">
            <a class="profile-toggle dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                <span class="avatar-sm" id="profileAvatarSmall"><i class="bi bi-person-fill"></i></span>
                <span id="navbarUsername" class="d-none d-md-inline">...</span>
            </a>
            <div class="dropdown-menu dropdown-menu-end profile-dropdown">
                <div class="profile-header">
                    <div class="avatar" id="profileAvatar"><i class="bi bi-person-fill"></i></div>
                    <div class="profile-username" id="profileUsername">—</div>
                    <span class="badge" id="profileRoleBadge">—</span>
                </div>
                <div class="profile-body">
                    <div class="profile-row">
                        <span class="label"><i class="bi bi-building me-1"></i>Отдел</span>
                        <span class="value" id="profileDepartment">—</span>
                    </div>
                    <div class="profile-row">
                        <span class="label"><i class="bi bi-bar-chart-steps me-1"></i>Грейд</span>
                        <span class="value" id="profileSeniority">—</span>
                    </div>
                </div>
                <div class="profile-footer text-center">
                    <button class="btn btn-outline-danger btn-sm w-100" onclick="logout()">
                        <i class="bi bi-box-arrow-right me-1"></i>Выйти
                    </button>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Управление правами пользователей</h2>
    </div>

    <div class="alert-container">
        <div id="statusMessage" class="alert d-none" role="alert"></div>
    </div>

    <div class="card shadow">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0" id="usersTable">
                <thead class="table-dark">
                <tr>
                    <th style="width: 10%">ID</th>
                    <th style="width: 40%">Логин (Username)</th>
                    <th style="width: 25%">Текущая роль</th>
                    <th style="width: 25%">Действия</th>
                </tr>
                </thead>
                <tbody id="usersTableBody">
                </tbody>
            </table>
            <div id="pagination-controls" class="d-flex justify-content-center m-3 gap-2"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const token = sessionStorage.getItem('jwt_token');

    if (!token) {
        window.location.href = '/login';
    }

    const authHeaders = {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
    };

    // Переменные пагинации
    let currentPage = 0;
    const pageSize = 15;

    function fillProfileCard(user) {
        const username = user.username || '—';
        const role = user.role || 'USER';

        document.getElementById('navbarUsername').textContent = username;
        document.getElementById('profileAvatarSmall').textContent = username.charAt(0).toUpperCase();
        document.getElementById('profileAvatar').textContent = username.charAt(0).toUpperCase();
        document.getElementById('profileUsername').textContent = username;

        const roleLabels = { 'USER': 'Пользователь', 'MANAGER': 'Руководитель', 'ADMIN': 'Администратор' };
        const roleBadge = document.getElementById('profileRoleBadge');
        roleBadge.textContent = roleLabels[role] || role;
        roleBadge.className = `badge role-badge-${role}`;

        document.getElementById('profileDepartment').textContent = user.department || 'Без отдела';
        renderSeniority(document.getElementById('profileSeniority'), user.seniority);
    }

    function renderSeniority(container, seniority) {
        container.replaceChildren();
        if (!seniority) {
            container.textContent = '—';
            return;
        }

        const badge = document.createElement('span');
        badge.className = 'seniority-badge';
        if (['INTERN', 'JUNIOR', 'MIDDLE', 'SENIOR', 'TEAM_LEAD'].includes(seniority)) {
            badge.classList.add(`seniority-${seniority}`);
        }
        badge.textContent = seniority;
        container.appendChild(badge);
    }

    async function loadCurrentUser() {
        const response = await fetch('/api/users/me', { headers: authHeaders });
        if (response.status === 401 || response.status === 403) {
            logout();
            return null;
        }
        if (!response.ok) {
            throw new Error('Не удалось загрузить профиль пользователя');
        }
        return response.json();
    }

    async function initializeAdminPage() {
        try {
            const user = await loadCurrentUser();
            if (!user) return;
            if (user.role !== 'ADMIN') {
                window.location.href = '/tasks';
                return;
            }
            fillProfileCard(user);
            await fetchUsers(0);
        } catch (error) {
            showStatus(error.message, 'danger');
        }
    }

    document.addEventListener('DOMContentLoaded', initializeAdminPage);

    function logout() {
        sessionStorage.removeItem('jwt_token');
        window.location.href = '/login';
    }

    // --- Универсальная функция отрисовки кнопок страниц ---
    function renderPagination(totalPages, currentPageNumber, containerId, fetchFunction) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';

        if (totalPages <= 1) return;

        const prevBtn = document.createElement('button');
        prevBtn.className = 'btn btn-outline-secondary btn-sm';
        prevBtn.innerText = '← Назад';
        prevBtn.disabled = (currentPageNumber === 0);
        prevBtn.onclick = () => fetchFunction(currentPageNumber - 1);
        container.appendChild(prevBtn);

        for (let i = 0; i < totalPages; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.className = `btn btn-sm ${i === currentPageNumber ? 'btn-primary' : 'btn-outline-primary'}`;
            pageBtn.innerText = i + 1;
            pageBtn.onclick = () => fetchFunction(i);
            container.appendChild(pageBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.className = 'btn btn-outline-secondary btn-sm';
        nextBtn.innerText = 'Вперед →';
        nextBtn.disabled = (currentPageNumber === totalPages - 1);
        nextBtn.onclick = () => fetchFunction(currentPageNumber + 1);
        container.appendChild(nextBtn);
    }

    // --- GET: Получение всех пользователей с пагинацией ---
    async function fetchUsers(page = 0) {
        currentPage = page;
        try {
            const response = await fetch(`/roles?page=${page}&size=${pageSize}`, {
                method: 'GET',
                headers: authHeaders
            });

            if (response.status === 401 || response.status === 403) {
                logout();
                return;
            }

            if (!response.ok) {
                throw new Error('Не удалось загрузить пользователей. Ошибка сервера.');
            }

            const data = await response.json();
            // Поддержка и Page<T> и List<T>
            const users = data.content !== undefined ? data.content : data;

            renderTable(users);

            if (data.totalPages !== undefined) {
                renderPagination(data.totalPages, data.number, 'pagination-controls', fetchUsers);
            } else {
                document.getElementById('pagination-controls').innerHTML = '';
            }
        } catch (error) {
            showStatus(error.message, 'danger');
        }
    }

    function renderTable(users) {
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '';

        users.forEach(user => {
            const tr = document.createElement('tr');

            const idCell = document.createElement('td');
            const idValue = document.createElement('strong');
            idValue.className = 'text-muted';
            idValue.textContent = user.id;
            idCell.appendChild(idValue);

            const usernameCell = document.createElement('td');
            const usernameValue = document.createElement('strong');
            usernameValue.textContent = user.username;
            usernameCell.appendChild(usernameValue);

            const roleCell = document.createElement('td');
            const roleBadge = document.createElement('span');
            roleBadge.className = 'badge bg-secondary fs-6';
            roleBadge.textContent = user.role;
            roleCell.appendChild(roleBadge);

            const actionsCell = document.createElement('td');
            const inputGroup = document.createElement('div');
            inputGroup.className = 'input-group input-group-sm';

            const select = document.createElement('select');
            select.className = 'form-select';
            select.id = `role-select-${user.id}`;
            const roleLabels = {
                'USER': 'Пользователь',
                'MANAGER': 'Руководитель',
                'ADMIN': 'Администратор'
            };
            Object.entries(roleLabels).forEach(([value, label]) => {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = label;
                option.selected = user.role === value;
                select.appendChild(option);
            });

            const saveButton = document.createElement('button');
            saveButton.className = 'btn btn-primary';
            saveButton.textContent = 'Сохранить';
            saveButton.addEventListener('click', () => upgradeRole(user.id));

            inputGroup.append(select, saveButton);
            actionsCell.appendChild(inputGroup);
            tr.append(idCell, usernameCell, roleCell, actionsCell);
            tbody.appendChild(tr);
        });
    }

    async function upgradeRole(userId) {
        const selectElement = document.getElementById(`role-select-${userId}`);
        const newRoleValue = selectElement.value;

        try {
            const response = await fetch(`/roles/${userId}?newRole=${newRoleValue}`, {
                method: 'PUT',
                headers: authHeaders
            });

            if (response.ok) {
                showStatus(`Роль для ID ${userId} успешно изменена на ${newRoleValue}. Пользователю нужно перезайти в систему.`, 'success');
                fetchUsers(currentPage); // Обновляем текущую страницу после изменения
            } else if (response.status === 403) {
                showStatus('У вас недостаточно прав для изменения ролей', 'danger');
            } else {
                throw new Error('Не удалось обновить роль. Ошибка: ' + response.status);
            }
        } catch (error) {
            showStatus(error.message, 'danger');
        }
    }

    function showStatus(message, type) {
        const statusDiv = document.getElementById('statusMessage');
        statusDiv.textContent = message;
        statusDiv.className = `alert alert-${type}`;
        statusDiv.classList.remove('d-none');

        setTimeout(() => {
            statusDiv.classList.add('d-none');
        }, 4000);
    }
</script>
<script src="/notifications.js"></script>
</body>
</html>
