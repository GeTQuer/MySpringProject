<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список задач</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .admin-nav-btn {
            color: #ffc107 !important;
            font-weight: bold;
            border: 1px solid #ffc107;
            border-radius: 6px;
            padding: 4px 12px !important;
            margin-left: 15px;
            transition: all 0.2s ease;
        }
        .admin-nav-btn:hover {
            background-color: #ffc107;
            color: #212529 !important;
        }

        /* --- Карточка профиля --- */
        .profile-dropdown {
            min-width: 280px;
            padding: 0;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            text-align: center;
            color: #fff;
        }
        .profile-header .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 24px;
        }
        .profile-header .profile-username {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .profile-body {
            padding: 16px 20px;
            background: #fff;
        }
        .profile-body .profile-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 14px;
            color: #555;
        }
        .profile-body .profile-row .label {
            font-weight: 500;
            color: #888;
        }
        .profile-body .profile-row .value {
            font-weight: 600;
            color: #333;
        }
        .profile-footer {
            padding: 12px 20px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
        }

        /* Badge цвета по ролям */
        .role-badge-USER { background-color: #0d6efd; }
        .role-badge-MANAGER { background-color: #fd7e14; }
        .role-badge-ADMIN { background-color: #dc3545; }

        /* Seniority badge */
        .seniority-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        .seniority-INTERN { background: #e3f2fd; color: #1565c0; }
        .seniority-JUNIOR { background: #e8f5e9; color: #2e7d32; }
        .seniority-MIDDLE { background: #fff3e0; color: #e65100; }
        .seniority-SENIOR { background: #fce4ec; color: #c62828; }
        .seniority-TEAM_LEAD { background: #f3e5f5; color: #6a1b9a; }

        /* Аккордеон подчинённых */
        .subordinates-section {
            margin-top: 24px;
        }
        .subordinates-section .accordion-button:not(.collapsed) {
            background-color: #fff3e0;
            color: #e65100;
        }

        /* Навбар кнопка профиля */
        .profile-toggle {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: 8px;
            transition: background 0.2s;
            color: #fff;
            text-decoration: none;
        }
        .profile-toggle:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .profile-toggle .avatar-sm {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Трекер задач</a>
        <div class="collapse navbar-collapse">
            <div class="navbar-nav" id="navLinks">
                <a class="nav-link active" href="/tasks">Мои Задачи</a>
            </div>
        </div>

        <!-- Карточка профиля (dropdown) -->
        <div class="dropdown">
            <a class="profile-toggle dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" id="profileDropdownToggle">
                <span class="avatar-sm" id="profileAvatarSmall"><i class="bi bi-person-fill"></i></span>
                <span id="navbarUsername" class="d-none d-md-inline">...</span>
            </a>
            <div class="dropdown-menu dropdown-menu-end profile-dropdown" id="profileDropdownMenu">
                <div class="profile-header">
                    <div class="avatar" id="profileAvatar"><i class="bi bi-person-fill"></i></div>
                    <div class="profile-username" id="profileUsername">—</div>
                    <span class="badge" id="profileRoleBadge">—</span>
                </div>
                <div class="profile-body">
                    <div class="profile-row">
                        <span class="label"><i class="bi bi-building me-1"></i>Отдел</span>
                        <span class="value" id="profileDepartment">—</span>
                    </div>
                    <div class="profile-row">
                        <span class="label"><i class="bi bi-bar-chart-steps me-1"></i>Грейд</span>
                        <span class="value" id="profileSeniority">—</span>
                    </div>
                </div>
                <div class="profile-footer text-center">
                    <button class="btn btn-outline-danger btn-sm w-100" onclick="logout()">
                        <i class="bi bi-box-arrow-right me-1"></i>Выйти
                    </button>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Список задач</h2>
        <button id="addTaskBtn" class="btn btn-success shadow-sm" data-bs-toggle="modal" data-bs-target="#addTaskModal">
            + Добавить задачу
        </button>
    </div>

    <div class="row mb-4 bg-white p-3 rounded shadow-sm border mx-0">
        <div class="col-md-4">
            <label class="form-label small text-muted">Поиск по описанию (текущая страница)</label>
            <input type="text" id="searchInput" class="form-control" placeholder="Введите текст...">
        </div>
        <div class="col-md-3">
            <label class="form-label small text-muted">Фильтр по статусу (БД)</label>
            <select id="statusFilter" class="form-select">
                <option value="ALL">Все статусы</option>
                <option value="OPEN">OPEN</option>
                <option value="IN_PROGRESS">IN_PROGRESS</option>
                <option value="DONE">DONE</option>
                <option value="CANCELLED">CANCELLED</option>
            </select>
        </div>
        <div class="col-md-5 border-start" id="adminDeleteBlock">
            <label class="form-label small text-muted">Быстрое удаление</label>
            <div class="input-group">
                <input type="number" id="deleteIdInput" class="form-control" placeholder="Введите ID задачи">
                <button class="btn btn-danger" id="deleteByIdBtn">Удалить</button>
            </div>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table align-middle" id="tasksTable">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Описание</th>
                    <th>Сотрудник</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody id="tasksBody">
                </tbody>
            </table>
            <div id="pagination-controls" class="d-flex justify-content-center mt-3 gap-2"></div>
        </div>
    </div>

    <!-- Секция подчинённых для MANAGER (accordion) -->
    <div class="subordinates-section" id="subordinatesSection" style="display:none;">
        <div class="accordion" id="subordinatesAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header" id="subordinatesHeading">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#subordinatesCollapse" aria-expanded="false" aria-controls="subordinatesCollapse">
                        <i class="bi bi-people-fill me-2"></i>Мои подчинённые
                    </button>
                </h2>
                <div id="subordinatesCollapse" class="accordion-collapse collapse" aria-labelledby="subordinatesHeading" data-bs-parent="#subordinatesAccordion">
                    <div class="accordion-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Отдел</th>
                                <th>Грейд</th>
                            </tr>
                            </thead>
                            <tbody id="subordinatesBody"></tbody>
                        </table>
                        <div id="subordinates-pagination" class="d-flex justify-content-center m-3 gap-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модалка: Новая задача -->
<div class="modal fade" id="addTaskModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Новая задача</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createTaskForm">
                    <div class="mb-3">
                        <label class="form-label">Описание задачи</label>
                        <input type="text" class="form-control" id="taskContent" required>
                    </div>
                    <div class="mb-3" id="assigneeContainer" style="display:none;">
                        <label class="form-label">Назначить задачу пользователю</label>
                        <select class="form-select" id="taskAssignee">
                            <option value="">Себе</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" id="saveTaskBtn">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<!-- Модалка: Редактирование задачи -->
<div class="modal fade" id="editTaskModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Редактирование задачи № <span id="editTaskIdLabel"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editTaskForm">
                    <input type="hidden" id="editTaskId">
                    <input type="hidden" id="editTaskVersion">
                    <div class="mb-3">
                        <label class="form-label">Описание задачи</label>
                        <input type="text" class="form-control" id="editTaskContent" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Сотрудник</label>
                        <input type="text" class="form-control" id="editTaskEmployee" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Статус</label>
                        <select class="form-select" id="editTaskStatus">
                            <option value="OPEN">OPEN</option>
                            <option value="IN_PROGRESS">IN_PROGRESS</option>
                            <option value="DONE">DONE</option>
                            <option value="CANCELLED">CANCELLED</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" id="updateTaskBtn">Изменить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const token = sessionStorage.getItem('jwt_token');
    if (!token) window.location.href = '/login';

    let currentRowElement = null;

    // Переменные пагинации
    let currentPage = 0;
    const pageSize = 15;
    let currentFetchMode = 'ALL';

    let isAdmin = false;
    let isManager = false;
    let currentUser = null;

    // ========================================================
    //  Карточка профиля: актуальные данные из /api/users/me
    // ========================================================
    function fillProfileCard(user) {
        const username = user.username || '—';
        const role = user.role || 'USER';

        document.getElementById('navbarUsername').textContent = username;
        document.getElementById('profileAvatarSmall').textContent = username.charAt(0).toUpperCase();
        document.getElementById('profileAvatar').textContent = username.charAt(0).toUpperCase();
        document.getElementById('profileUsername').textContent = username;

        const roleLabels = { 'USER': 'Пользователь', 'MANAGER': 'Руководитель', 'ADMIN': 'Администратор' };
        const roleBadge = document.getElementById('profileRoleBadge');
        roleBadge.textContent = roleLabels[role] || role;
        roleBadge.className = `badge role-badge-${role}`;

        document.getElementById('profileDepartment').textContent = user.department || 'Без отдела';
        renderSeniority(document.getElementById('profileSeniority'), user.seniority);
    }

    function renderSeniority(container, seniority) {
        container.replaceChildren();
        if (!seniority) {
            container.textContent = '—';
            return;
        }

        const badge = document.createElement('span');
        badge.className = 'seniority-badge';
        if (['INTERN', 'JUNIOR', 'MIDDLE', 'SENIOR', 'TEAM_LEAD'].includes(seniority)) {
            badge.classList.add(`seniority-${seniority}`);
        }
        badge.textContent = seniority;
        container.appendChild(badge);
    }

    async function loadCurrentUser() {
        const response = await fetch('/api/users/me', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.status === 401 || response.status === 403) {
            logout();
            return null;
        }
        if (!response.ok) {
            throw new Error('Не удалось загрузить профиль пользователя');
        }
        return response.json();
    }

    function appendNavLink(text, clickHandler, href = '#') {
        const link = document.createElement('a');
        link.className = 'nav-link';
        link.href = href;
        link.textContent = text;
        if (clickHandler) {
            link.addEventListener('click', event => {
                event.preventDefault();
                clickHandler();
            });
        }
        document.getElementById('navLinks').appendChild(link);
    }

    async function initializePage() {
        try {
            currentUser = await loadCurrentUser();
            if (!currentUser) return;

            isAdmin = currentUser.role === 'ADMIN';
            isManager = currentUser.role === 'MANAGER';
            fillProfileCard(currentUser);

            const primaryNavLink = document.querySelector('#navLinks .nav-link');

            if (isAdmin) {
                primaryNavLink.textContent = 'Все задачи';
                document.getElementById('addTaskBtn').style.display = 'none';
                const adminLink = document.createElement('a');
                adminLink.className = 'nav-link admin-nav-btn';
                adminLink.href = '/admin';
                adminLink.textContent = '⚙️ Админ панель';
                document.getElementById('navLinks').appendChild(adminLink);
            } else if (isManager) {
                primaryNavLink.textContent = 'Задачи отдела';
                appendNavLink('Мои задачи', () => loadMyTasks(0));
                document.getElementById('assigneeContainer').style.display = 'block';
                await loadAssignableUsers();
                document.getElementById('subordinatesSection').style.display = 'block';
                await loadSubordinates(0);
            }

            await loadTasks(0);
        } catch (error) {
            console.error(error);
            alert(error.message);
        }
    }

    document.addEventListener('DOMContentLoaded', initializePage);

    // ========================================================
    //  Загрузка подчинённых для MANAGER
    // ========================================================
    let subordinatesCurrentPage = 0;
    const subordinatesPageSize = 10;

    async function loadSubordinates(page = 0) {
        subordinatesCurrentPage = page;
        try {
            const response = await fetch(`/api/users/department?page=${page}&size=${subordinatesPageSize}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.status === 401 || response.status === 403) {
                logout();
                return;
            }
            if (!response.ok) {
                console.error('Ошибка загрузки подчинённых:', response.status);
                return;
            }
            const data = await response.json();
            const users = data.content !== undefined ? data.content : data;

            const tbody = document.getElementById('subordinatesBody');
            tbody.innerHTML = '';

            users.forEach(user => {
                const tr = document.createElement('tr');

                const idCell = document.createElement('td');
                const idValue = document.createElement('strong');
                idValue.className = 'text-muted';
                idValue.textContent = user.id;
                idCell.appendChild(idValue);

                const usernameCell = document.createElement('td');
                const usernameValue = document.createElement('strong');
                usernameValue.textContent = user.username;
                usernameCell.appendChild(usernameValue);

                const departmentCell = document.createElement('td');
                departmentCell.textContent = user.department || 'Без отдела';

                const seniorityCell = document.createElement('td');
                renderSeniority(seniorityCell, user.seniority);

                tr.append(idCell, usernameCell, departmentCell, seniorityCell);
                tbody.appendChild(tr);
            });

            if (data.totalPages !== undefined) {
                renderPagination(data.totalPages, data.number, 'subordinates-pagination', loadSubordinates);
            } else {
                document.getElementById('subordinates-pagination').innerHTML = '';
            }
        } catch (e) {
            console.error('Ошибка загрузки подчинённых:', e);
        }
    }

    // ========================================================
    //  Загрузка списка assignable пользователей (для MANAGER)
    // ========================================================
    async function loadAssignableUsers() {
        try {
            const response = await fetch('/api/users/assignable', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.status === 401 || response.status === 403) {
                logout();
                return;
            }
            if (!response.ok) throw new Error('Не удалось загрузить пользователей');
            const users = await response.json();
            const select = document.getElementById('taskAssignee');
            select.replaceChildren();

            const selfOption = document.createElement('option');
            selfOption.value = '';
            selfOption.textContent = 'Себе';
            select.appendChild(selfOption);

            users.forEach(user => {
                const option = document.createElement('option');
                option.value = user.username;
                option.textContent = user.username;
                select.appendChild(option);
            });
        } catch (e) {
            console.error('Ошибка загрузки assignable пользователей:', e);
        }
    }

    function logout() {
        sessionStorage.removeItem('jwt_token');
        window.location.href = '/login';
    }

    function refreshCurrentView() {
        if (currentFetchMode === 'ALL' || currentFetchMode === 'DEPARTMENT') loadTasks(currentPage);
        else loadMyTasks(currentPage);
    }

    function getTaskEndpoint(taskId) {
        if (isAdmin) return `/api/tasks/admin/${taskId}`;
        if (isManager) return `/api/tasks/department/${taskId}`;
        return `/api/tasks/${taskId}`;
    }

    function getDeleteEndpoint(taskId, version) {
        let endpoint = `/api/tasks/${taskId}`;
        if (isAdmin) endpoint = `/api/tasks/admin/${taskId}`;
        else if (isManager) endpoint = `/api/tasks/manager/${taskId}`;

        return `${endpoint}?version=${encodeURIComponent(version)}`;
    }

    async function getErrorMessage(response, fallbackMessage) {
        try {
            const body = await response.json();
            return body.error || fallbackMessage;
        } catch (error) {
            return fallbackMessage;
        }
    }

    // --- Универсальная функция отрисовки кнопок страниц ---
    function renderPagination(totalPages, currentPageNumber, containerId, fetchFunction) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';

        if (totalPages <= 1) return;

        const prevBtn = document.createElement('button');
        prevBtn.className = 'btn btn-outline-secondary btn-sm';
        prevBtn.innerText = '← Назад';
        prevBtn.disabled = (currentPageNumber === 0);
        prevBtn.onclick = () => fetchFunction(currentPageNumber - 1);
        container.appendChild(prevBtn);

        for (let i = 0; i < totalPages; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.className = `btn btn-sm ${i === currentPageNumber ? 'btn-primary' : 'btn-outline-primary'}`;
            pageBtn.innerText = i + 1;
            pageBtn.onclick = () => fetchFunction(i);
            container.appendChild(pageBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.className = 'btn btn-outline-secondary btn-sm';
        nextBtn.innerText = 'Вперед →';
        nextBtn.disabled = (currentPageNumber === totalPages - 1);
        nextBtn.onclick = () => fetchFunction(currentPageNumber + 1);
        container.appendChild(nextBtn);
    }

    // --- GET: Загрузка задач (с фильтрацией по статусу) ---
    async function loadTasks(page = 0) {
        currentPage = page;
        const status = document.getElementById('statusFilter').value;

        let endpoint;
        if (isAdmin) {
            currentFetchMode = 'ALL';
            endpoint = '/api/tasks/all';
        } else if (isManager) {
            currentFetchMode = 'DEPARTMENT';
            endpoint = '/api/tasks/department';
        } else {
            currentFetchMode = 'MY';
            endpoint = '/api/tasks/my';
        }

        let url = `${endpoint}?page=${page}&size=${pageSize}`;
        if (status !== 'ALL') url += `&status=${status}`;

        const response = await fetch(url, {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
            const data = await response.json();
            const tasks = data.content !== undefined ? data.content : data;

            const tbody = document.getElementById('tasksBody');
            tbody.innerHTML = '';
            tasks.forEach(task => addRowToTable(task));

            if (data.totalPages !== undefined) {
                renderPagination(data.totalPages, data.number, 'pagination-controls', loadTasks);
            } else {
                document.getElementById('pagination-controls').innerHTML = '';
            }
        } else {
            logout();
        }
    }

    async function loadMyTasks(page = 0) {
        currentPage = page;
        currentFetchMode = 'MY';
        const status = document.getElementById('statusFilter').value;

        let url = `/api/tasks/my?page=${page}&size=${pageSize}`;
        if (status !== 'ALL') url += `&status=${status}`;

        const response = await fetch(url, {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
            const data = await response.json();
            const tasks = data.content !== undefined ? data.content : data;

            const tbody = document.getElementById('tasksBody');
            tbody.innerHTML = '';
            tasks.forEach(task => addRowToTable(task));

            if (data.totalPages !== undefined) {
                renderPagination(data.totalPages, data.number, 'pagination-controls', loadMyTasks);
            } else {
                document.getElementById('pagination-controls').innerHTML = '';
            }
        } else {
            alert('Ошибка загрузки ваших задач');
        }
    }

    function addRowToTable(task) {
        const tbody = document.getElementById('tasksBody');
        const tr = document.createElement('tr');

        const idCell = document.createElement('td');
        idCell.className = 'task-id';
        idCell.textContent = task.id;

        const contentCell = document.createElement('td');
        contentCell.className = 'task-content';
        contentCell.textContent = task.content;

        const employeeCell = document.createElement('td');
        employeeCell.className = 'task-employee';
        employeeCell.textContent = task.fullNameEmployee;

        const statusCell = document.createElement('td');
        statusCell.className = 'task-status';
        const statusBadge = document.createElement('span');
        statusBadge.className = 'badge bg-primary';
        statusBadge.textContent = task.status;
        statusCell.appendChild(statusBadge);

        const actionsCell = document.createElement('td');
        const editButton = document.createElement('button');
        editButton.className = 'btn btn-sm btn-primary me-1';
        editButton.textContent = 'Редактировать';
        editButton.addEventListener('click', () => openEditModal(task.id, editButton));

        const deleteButton = document.createElement('button');
        deleteButton.className = 'btn btn-sm btn-danger';
        deleteButton.textContent = 'Удалить';
        deleteButton.addEventListener('click', () => deleteTask(task.id, task.version, deleteButton));

        actionsCell.append(editButton, deleteButton);
        tr.append(idCell, contentCell, employeeCell, statusCell, actionsCell);
        tbody.appendChild(tr);
    }

    document.getElementById('saveTaskBtn').addEventListener('click', async () => {
        if (isAdmin) return;

        const form = document.getElementById('createTaskForm');
        if (!form.reportValidity()) return;

        const payload = {
            content: document.getElementById('taskContent').value.trim(),
            status: "OPEN"
        };

        if (isManager) {
            const assignee = document.getElementById('taskAssignee').value;
            if (assignee) {
                payload.assignedUsername = assignee;
            }
        }

        const response = await fetch('/api/tasks', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            bootstrap.Modal.getInstance(document.getElementById('addTaskModal')).hide();
            document.getElementById('createTaskForm').reset();
            document.getElementById('taskAssignee').value = '';
            refreshCurrentView();
        } else {
            alert(await getErrorMessage(response, "Ошибка при сохранении задачи"));
        }
    });

    async function deleteTask(taskId, version, btnElement) {
        if (!confirm("Точно удалить?")) return;

        const endpoint = getDeleteEndpoint(taskId, version);

        const response = await fetch(endpoint, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
            refreshCurrentView();
        } else {
            alert(await getErrorMessage(
                response,
                "Ошибка при удалении задачи! Возможно у вас нет прав."
            ));
            if (response.status === 409) refreshCurrentView();
        }
    }

    async function openEditModal(taskId, btnElement) {
        currentRowElement = btnElement.closest('tr');

        const endpoint = getTaskEndpoint(taskId);

        const response = await fetch(endpoint, {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
            const task = await response.json();

            document.getElementById('editTaskId').value = taskId;
            document.getElementById('editTaskVersion').value = task.version;
            document.getElementById('editTaskIdLabel').textContent = taskId;
            document.getElementById('editTaskContent').value = task.content;
            document.getElementById('editTaskEmployee').value = task.fullNameEmployee;
            document.getElementById('editTaskStatus').value = task.status;

            const editModal = new bootstrap.Modal(document.getElementById('editTaskModal'));
            editModal.show();
        } else {
            alert("Ошибка при загрузке задачи для редактирования");
        }
    }

    document.getElementById('updateTaskBtn').addEventListener('click', async () => {
        const taskId = document.getElementById('editTaskId').value;
        const payload = {
            content: document.getElementById('editTaskContent').value,
            fullNameEmployee: document.getElementById('editTaskEmployee').value,
            status: document.getElementById('editTaskStatus').value,
            version: Number(document.getElementById('editTaskVersion').value)
        };

        const endpoint = getTaskEndpoint(taskId);

        const response = await fetch(endpoint, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            bootstrap.Modal.getInstance(document.getElementById('editTaskModal')).hide();
            refreshCurrentView();
        } else {
            alert(await getErrorMessage(response, "Ошибка при обновлении задачи"));
            if (response.status === 409) {
                bootstrap.Modal.getInstance(document.getElementById('editTaskModal')).hide();
                refreshCurrentView();
            }
        }
    });

    // Фильтрация поиска по тексту (остается на клиенте для текущей страницы)
    function filterTableText() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#tasksBody tr');

        rows.forEach(row => {
            const content = row.querySelector('.task-content').textContent.toLowerCase();
            const matchesText = content.includes(searchText);
            // Восстанавливаем отображение на основе текстового поиска
            row.style.display = matchesText ? '' : 'none';
        });
    }

    document.getElementById('searchInput').addEventListener('input', filterTableText);

    // Фильтрация по статусу теперь перезапрашивает данные с сервера
    document.getElementById('statusFilter').addEventListener('change', refreshCurrentView);

    // Быстрое удаление
    document.getElementById('deleteByIdBtn').addEventListener('click', async () => {
        const idInput = document.getElementById('deleteIdInput');
        const taskId = idInput.value.trim();

        if (!taskId) {
            alert("Введите ID для удаления!");
            return;
        }

        if (!confirm(`Вы уверены, что хотите удалить задачу с ID ${taskId}?`)) return;

        const taskResponse = await fetch(getTaskEndpoint(taskId), {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!taskResponse.ok) {
            alert(await getErrorMessage(
                taskResponse,
                "Ошибка! Возможно, задачи с таким ID не существует или нет прав."
            ));
            return;
        }

        const task = await taskResponse.json();
        const endpoint = getDeleteEndpoint(taskId, task.version);

        const response = await fetch(endpoint, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
            idInput.value = '';
            refreshCurrentView();
            alert(`Задача ${taskId} успешно удалена.`);
        } else {
            alert(await getErrorMessage(
                response,
                "Ошибка! Возможно, задачи с таким ID не существует или нет прав."
            ));
            if (response.status === 409) refreshCurrentView();
        }
    });

    document.getElementById('addTaskBtn').addEventListener('click', function (e) {
        e.preventDefault();
        const modal = new bootstrap.Modal(document.getElementById('addTaskModal'));
        modal.show();
    });
</script>
</body>
</html>
