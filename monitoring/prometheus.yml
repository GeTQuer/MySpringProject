global:
  scrape_interval: 15s

scrape_configs:
  - job_name: task-tracker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8080

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - notification-service:8081
