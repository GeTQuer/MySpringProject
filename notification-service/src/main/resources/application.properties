spring.application.name=notification-service


server.port=${NOTIFICATION_SERVICE_PORT:8081}

spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5433/notifications}
spring.datasource.username=${NOTIFICATION_DB_USERNAME:notifications}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:notifications}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always

security.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}


spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=batch

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
